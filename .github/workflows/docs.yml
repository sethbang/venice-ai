name: Docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pydoc-markdown
        run: pip install pydoc-markdown==4.8.2

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      # `npm run build` runs prebuild -> pydoc-markdown + prune, then the Docusaurus
      # build with onBrokenLinks: 'throw' (the link-check gate).
      - name: Build site
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/build --project-name=venice-ai-docs --branch=main
