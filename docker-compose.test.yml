services:
  redis:
    image: redis:7-alpine
    container_name: venice-ai-test-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - venice-ai-test

volumes:
  redis_test_data:
    driver: local

networks:
  venice-ai-test:
    driver: bridge